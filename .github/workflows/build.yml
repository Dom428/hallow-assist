# Builds Hallow Assist and runs its tests on every push and pull request. Nothing is released from here.
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relay tests
        working-directory: server
        run: npm test

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app and the unit tests
        shell: powershell
        run: ./build.ps1 -Tests
      - name: Unit tests
        shell: powershell
        run: |
          & .\tests\AssistTests.exe
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }
      - name: Keep the exe
        uses: actions/upload-artifact@v4
        with:
          name: HallowAssist
          path: HallowAssist.exe
          retention-days: 7
