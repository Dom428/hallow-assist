# Builds Hallow Assist and runs its tests on every push and pull request. Nothing is released from here.
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      print_snaps:
        description: 'Also print these pictures into the log as base64 (comma-separated file names, e.g. main.png)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relay tests
        working-directory: server
        run: npm test

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the app and the unit tests
        shell: powershell
        run: ./build.ps1 -Tests
      - name: Unit tests
        shell: powershell
        run: |
          & .\tests\AssistTests.exe
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }
      - name: Integration tests (local relay, two app copies in test mode, the browser viewer in headless Edge)
        shell: powershell
        run: |
          node tests/integration.mjs "$PWD\tests\out"
          if ($LASTEXITCODE -ne 0) { throw "integration tests failed" }
      - name: Keep the integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration
          path: tests/out/*.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Pictures of every window (made-up data)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force snaps | Out-Null
          $p = Start-Process .\HallowAssist.exe -ArgumentList '--snap', "$PWD\snaps" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "--snap failed ($($p.ExitCode))" }
          if (-not (Get-ChildItem snaps -Filter *.png)) { throw "--snap made no pictures" }
          Get-ChildItem snaps | Format-Table Name, Length
          foreach ($n in ('${{ inputs.print_snaps }}' -split ',' | Where-Object { $_.Trim() })) {
            $f = Join-Path snaps ([IO.Path]::GetFileName($n.Trim()))
            if (Test-Path $f) { "SNAP-BEGIN $n"; [Convert]::ToBase64String([IO.File]::ReadAllBytes($f)) -split '(.{4000})' | Where-Object { $_ }; "SNAP-END $n" }
          }
      - name: Keep the exe
        uses: actions/upload-artifact@v4
        with:
          name: HallowAssist
          path: HallowAssist.exe
          retention-days: 7
      - name: Keep the pictures
        uses: actions/upload-artifact@v4
        with:
          name: snaps
          path: snaps
          retention-days: 7
